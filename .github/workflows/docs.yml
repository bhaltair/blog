name: docs

on:
  # 每当 push 到 master 分支时触发部署
  push:
    branches: [master]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          # 选择要使用的 node 版本（和你本地保持一致，推荐 20 或 22）
          node-version: 22
          # 使用 npm 缓存（自动缓存 node_modules 和 package-lock.json）
          cache: 'npm'

      - name: 安装依赖
        run: npm ci          # 推荐使用 ci，比 install 更严格且适合 CI 环境

      # 运行构建脚本（假设你在 package.json 中定义了 "docs:build"）
      - name: 构建 VuePress 站点
        run: npm run docs:build

      # 部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # 部署到 gh-pages 分支
          target_branch: gh-pages
          # VuePress 默认的构建输出目录
          build_dir: docs/.vuepress/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}